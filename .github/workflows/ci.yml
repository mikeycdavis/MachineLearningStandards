name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # There is no install step, and that is a decision rather than an omission.
      # This repository has zero third-party dependencies (design/architecture.md §12).
      # Because CI cannot install anything, adding a dependency breaks the build — which
      # is the only form of that rule that survives contact with a deadline. If an
      # `npm ci` ever appears here, the decision changed and the ADR should say so.

      - name: Source inventory
        run: npm run inventory

      - name: Source fidelity
        run: npm run fidelity

      - name: Project policy
        run: npm run policy

      - name: Catalog integrity
        run: npm run integrity

      # The catalog check locks what each rule IS. This one locks what each rule ACCEPTS,
      # which is the part that moved unnoticed when Standard 15 R2 was widened. Exits 3.
      - name: Acceptance lock
        run: npm run acceptance

      - name: Diagram freshness
        run: npm run diagrams

      - name: Test
        run: npm test

      # Deliberately not `--strict`. That flag fails the build on warnings too, and a
      # build that breaks on heuristics is a build someone eventually disables. The
      # error-level gate is the assertion inside the test suite that this repository
      # produces no error-severity findings.
      - name: Scan this repository
        run: npm run scan

      # The gate. Exits 1 on a required-rule failure, 2 on NOT_EVALUATED, 3 if an
      # invariant was violated.
      #
      # This step used to be a bare `npm run evaluate`, and it was green for the wrong
      # reason. Every domain rule in project-policy.yml is declared not-applicable —
      # correctly, since there is no ML work in a standards repository — so from 1.4.2
      # this evaluation honestly reports NOT_EVALUATED and exits 2. Before 1.4.2 it
      # reported COMPLIANT on having established nothing, and this step passed on that.
      #
      # So the step asserts what is actually true instead: nothing here is applicable, and
      # therefore nothing may be failing. NON_COMPLIANT and BLOCKED_BY_INVARIANT still fail
      # the build, and so does the appearance of an applicable rule — because that means ML
      # work has arrived in this repository and the policy's not-applicable declarations
      # need re-reading rather than silently passing.
      - name: Evaluate this repository
        run: |
          node scripts/standards.mjs evaluate . --json > verdict.json || true
          node -e '
            const v = JSON.parse(require("fs").readFileSync("verdict.json", "utf8"));
            const { status, denominator } = v;
            if (status === "NOT_EVALUATED" && denominator.applicable === 0) {
              console.log("NOT_EVALUATED with 0 applicable rules — expected, and honest.");
              process.exit(0);
            }
            console.error(`status=${status} applicable=${denominator.applicable} scored=${denominator.scored}`);
            console.error("Expected NOT_EVALUATED with 0 applicable rules. Read project-policy.yml.");
            process.exit(1);
          '
