# Project policy — MachineLearningStandards, evaluated against itself.
#
# This repository is dogfooded rather than special-cased out of evaluation. Every rule in the
# catalog is machine-learning work, and this repository does none of it, so every rule is
# declared not-applicable WITH A REASON — not left to fall silently into not-evaluated. An
# unstated exclusion is indistinguishable from an oversight, which is the whole argument for
# making applicability an explicit declaration.
#
# Each declaration carries revisitWhen, so the assumption has an expiry condition rather than
# being permanent by default. `standards status` reports when a trigger contradicts one.
#
# Note what is NOT here: the invariants. A policy may not address them, and naming one is
# itself reported as an attempted weakening. They are checked by scripts/integrity.mjs and by
# the test suite, which is what self-evaluation in this repository actually exercises.

standardVersion: "1.0.0"
project: "MachineLearningStandards"

exceptions: []

